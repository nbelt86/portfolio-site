<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan Beltran — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <!-- React itself, plus Babel so the browser can understand JSX without a build tool -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // Your React components go here

    const text = {
      en: {
        toggleLabel: "日本語",
        heroTitle: "Aspiring Web Developer - Nathan Beltran",
        tagline: "Full-Stack Developer — Ruby on Rails & JavaScript",
        aboutTitle: "About",
        aboutText: "I'm a Le Wagon bootcamp graduate based in Osaka, Japan, building full-stack web applications with Ruby on Rails and rebuilding my JavaScript fundamentals from the ground up. I like turning ideas into working products — from AI-powered apps to small tools that solve a real problem.",
        projectsTitle: "Projects",
        linkLabel: "Link",
        teamLabel: "Team Project"
      },
      ja: {
        toggleLabel: "English",
        heroTitle: "Webエンジニア志望 - ベルトラン ネイサン",
        tagline: "フルスタックエンジニア — Ruby on Rails & JavaScript",
        aboutTitle: "自己紹介",
        aboutText: "大阪在住のLe Wagon卒業生です。Ruby on Railsを使ったフルスタックのWebアプリケーション開発を行いながら、JavaScriptの基礎を一から学び直しています。AIを活用したアプリから実用的な小さなツールまで、アイデアを形にすることが好きです。",
        projectsTitle: "制作物",
        linkLabel: "リンク",
        teamLabel: "チームプロジェクト"
      }
    }

    const projects = [
      {name: "Passion for Fashion",
      description: "AI powered fashion advice app",
      descriptionJa: "AIを活用したファッションアドバイスアプリ",
      link:"https://passion-for-fashion.onrender.com/",
      image: "images/passion4fasion-screenshot.png",
      team: true,
      role: "My role: built the entire frontend.",
      roleJa: "担当: フロントエンド全体を担当。" },

      {name: "Dategent",
      description: "AI powered dating app. Get paired by AI.",
      descriptionJa: "AIを活用したマッチングアプリ。AIがお相手を見つけます。",
      link:"https://nathanswatchlist-d527e9354110.herokuapp.com/",
      image: "images/dategent-screenshot.png",
      team: true,
      role: "My role: AI prompt engineering, LLM integration, and the full venue-based matchmaking system.",
      roleJa: "担当: AIプロンプトエンジニアリング、LLM実装、会場情報を活用したマッチングシステム全体を担当。" },

      {name: "Exercise Tracker",
      description: "Track your own workout with the help of this app. Still in active development — not yet deployed live.",
      descriptionJa: "このアプリでワークアウトを記録・管理できます。現在開発中で、まだ本番公開はしていません。",
      link:"https://github.com/nbelt86/exercise-tracker",
      image: "images/exercise-tracker-demo.gif"},

      {name: "Movie Search",
      description:"A movie search app using the OMDB API",
      descriptionJa: "OMDB APIを使った映画検索アプリ",
      link: "https://nbelt86.github.io/movie-search-app/",
      image: "images/movie-search-demo.gif",
      }]

    function Header (props) {
      return <div className="hero">
        <button onClick={props.onToggleLang} className="lang-toggle">{props.t.toggleLabel}</button>
        <img src="images/profile.jpg" alt="Nathan Beltran" className="profile-pic" />
        <h1>{props.t.heroTitle}</h1>
        <p className="tagline">{props.t.tagline}</p>
        <h1 className="name-jp">ベルとラン　ネイサン</h1>
        </div>
    }

    function ProjectCard (props) {
      return <div className="project-card">
        <img src={props.image} alt={props.name} className="project-card-image" />
        <h1>{props.name}</h1>
        {props.team && <span className="team-badge">{props.teamLabel}</span>}
        <h2>{props.description}</h2>
        {props.role && <p className="project-role">{props.role}</p>}
        <a href={props.link}>{props.linkLabel}</a>
      </div>

    }

    function AboutSection (props) {
      const skills = ["Ruby on Rails", "JavaScript", "HTML/CSS", "Tailwind CSS", "React", "Hotwire (Turbo/Stimulus)", "PostgreSQL", "Git"]
      return <div className="about-section">
        <h2 className="section-title section-title-light">{props.t.aboutTitle}</h2>
        <p className="about-text">
          {props.t.aboutText}
        </p>
        <div className="skills-list">
          {skills.map(skill => <span className="skill-tag" key={skill}>{skill}</span>)}
        </div>
      </div>
    }

    function Footer (props) {
      return <footer className="footer">
        <a href="https://github.com/nbelt86" className="footer-link">GitHub</a>
        <span className="footer-divider">·</span>
        <a href="mailto:nbelt86@gmail.com" className="footer-link">nbelt86@gmail.com</a>
        <span className="footer-divider">·</span>
        <a href="https://github.com/nbelt86/portfolio-site" className="footer-link">Source</a>
      </footer>
    }

    function App (props) {
      const [lang, setLang] = React.useState("en")
      const t = text[lang]
      const toggleLang = () => setLang(lang === "en" ? "ja" : "en")

      return <div className="container">
        <Header t={t} onToggleLang={toggleLang} />

        <AboutSection t={t} />

        <h2 className="section-title section-title-light">{t.projectsTitle}</h2>
        <div className="projects-grid">
          {projects.map(project => <ProjectCard key={project.name} name={project.name}
          description={lang === "en" ? project.description : project.descriptionJa}
          role={project.team ? (lang === "en" ? project.role : project.roleJa) : null}
          team={project.team} teamLabel={t.teamLabel}
          link={project.link} image={project.image} linkLabel={t.linkLabel} />)}
        </div>

        <Footer />

      </div>
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />)
  </script>
</body>
</html>
