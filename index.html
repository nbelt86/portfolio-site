<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan Beltran — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <!-- React itself, plus Babel so the browser can understand JSX without a build tool -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // Your React components go here
    function Header (props) {
      return <div className="hero">
        <h1>Aspiring Web Developer - Nathan Beltran </h1>
        <h1 className="name-jp">ベルとラン　ネイサン</h1>
        </div>
    }

    function ProjectCard (props) {
      return <div className="project-card">
        <h1>{props.name}</h1>
        <h2>{props.description}</h2>
        <a href={props.link}>Link</a>
      </div>

    }

    const projects = [
      {name: "Passion for Fashion",
      description: "AI powered fashion advice app",
      link:"https://passion-for-fashion.onrender.com/" },

      {name: "Dategent",
      description: "AI powered dating app. Get paired by AI.",
      link:"https://www.dategent.net/"},

      {name: "Exercise Tracker",
      description: "Track your own workout with the help of this app.",
      link:"..."},

      {name: "Movie Search",
      description:"A movie search app using the OMDB API",
      link: "https://nbelt86.github.io/movie-search-app/",
      }]

    ReactDOM.createRoot(document.getElementById("root")).render(
      <div className="container">
        <Header />

        <div className="projects-grid">
          {projects.map(project => <ProjectCard name={project.name}
          description={project.description} link={project.link} />)}
        </div>

      </div>
    )
  </script>
</body>
</html>
