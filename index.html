<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan Beltran — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root"></div>

  <!-- React itself, plus Babel so the browser can understand JSX without a build tool -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    // Your React components go here
    function ProjectCard (props) {
      return <h1>{props.name}</h1>

    }

    const projects = ["Passion for Fashion", "Dategent", "Exercise Tracker", "Movie Search"]

    ReactDOM.createRoot(document.getElementById("root")).render(
      <div>
        {projects.map(name => <ProjectCard name={name} />)}
      </div>
    )
  </script>
</body>
</html>
